name: Study task
description: 주차별 학습 과제 등록
title: "[WeekN] 이름 - 과제 제목"

body:
  - type: input
    id: name
    attributes:
      label: 이름
      placeholder: 홍길동
    validations:
      required: true

  - type: dropdown
    id: team
    attributes:
      label: 팀
      options:
        - 공통
        - 인지
        - 보행
    validations:
      required: true

  - type: dropdown
    id: week
    attributes:
      label: 주차
      options:
        - Week1
        - Week2
        - Week3
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: 제출 기한
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이번 과제에서 구현하거나 달성할 내용
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 완료 기준
      description: 어떤 결과가 나오면 완료인지 작성
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 과제 안내나 교보재 링크
